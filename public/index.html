<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Polynesian 2027 Trip Planner</title>

    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>

    <header class="trip-header">
        <div class="header-content">

            <div class="trip-brand">
                <div class="trip-icon">🌺</div>

                <div>
                    <h1>Polynesian 2027</h1>
                    <p>Our Walt Disney World Adventure</p>
                </div>
            </div>

            <div class="current-user">
                Hi, Ron
            </div>

        </div>

        <nav class="main-nav">
            <a href="#" class="active">Home</a>
            <a href="#">Rides</a>
            <a href="#">Dining</a>
            <a href="#">Shows</a>
            <a href="#">Activities</a>
        </nav>
    </header>


    <main class="page-container">

        <section class="welcome">

            <p class="eyebrow">YOUR TRIP</p>

            <h2>Good afternoon, Ron.</h2>

            <p class="welcome-message">
                What sounds good for this trip?
            </p>

            <div class="trip-details">
                <span>🌴 Disney's Polynesian Village Resort</span>
                <span>•</span>
                <span>7 Nights</span>
                <span>•</span>
                <span>6 Travelers</span>
            </div>


            <div class="progress-section">

                <div class="progress-heading">
                    <span>Your trip picks</span>
                    <strong>18 of 47</strong>
                </div>

                <div class="progress-bar">
                    <div class="progress-value"></div>
                </div>

                <p class="progress-message">
                    29 more things waiting for your opinion.
                </p>

            </div>

        </section>

    </main>

</body>
</html>
